<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Şu An Çalışıyor mu?</title>
    <style>
        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; color: white;
            text-align: center; transition: background-color 0.8s ease;
        }
        .status-title { font-size: 2.5rem; margin-bottom: 0; opacity: 0.9; }
        .status-value { font-size: 8rem; font-weight: 900; margin: 10px 0; }
        .info-card {
            background: rgba(0, 0, 0, 0.2); padding: 25px; border-radius: 20px;
            backdrop-filter: blur(10px); margin-top: 20px; min-width: 300px;
        }
        .info-line { font-size: 1.1rem; margin: 8px 0; display: flex; justify-content: space-between; }
        .label { font-weight: bold; margin-right: 15px; opacity: 0.8; }
    </style>
</head>
<body>

    <p class="status-title">Barış şu an çalışıyor mu?</p>
    <div id="status" class="status-value">Yükleniyor...</div>

    <div id="card" class="info-card">
        <div id="content"></div>
    </div>

    <script>
        function parseDateTime(dateStr, timeStr) {
            const [d, m, y] = dateStr.split('.');
            const [hr, min] = timeStr.split(':');
            return new Date(y, m - 1, d, hr, min);
        }

        async function updateLiveStatus() {
            try {
                const response = await fetch('schedule.csv');
                const text = await response.text();
                const shifts = text.split('\n').slice(1).filter(r => r.trim() !== "").map(row => {
                    const cols = row.split(',');
                    return {
                        start: parseDateTime(cols[0], cols[1]),
                        end: parseDateTime(cols[2], cols[3]),
                        startStr: `${cols[0]} ${cols[1]}`,
                        endStr: `${cols[2]} ${cols[3]}`
                    };
                });

                const now = new Date();
                const statusDiv = document.getElementById('status');
                const contentDiv = document.getElementById('content');
                
                // 1. Şu an işte miyim?
                const currentShift = shifts.find(s => now >= s.start && now <= s.end);

                if (currentShift) {
                    // EVET DURUMU
                    statusDiv.innerText = "EVET";
                    document.body.style.backgroundColor = "#28a745";
                    contentDiv.innerHTML = `
                        <div class="info-line"><span class="label">Mesai Başlangıcı:</span><span>${currentShift.startStr}</span></div>
                        <div class="info-line"><span class="label">Mesai Bitişi:</span><span>${currentShift.endStr}</span></div>
                    `;
                } else {
                    // HAYIR DURUMU
                    statusDiv.innerText = "HAYIR";
                    document.body.style.backgroundColor = "#dc3545";

                    // Bir önceki ve bir sonraki mesaiyi bul
                    const pastShifts = shifts.filter(s => now > s.end).sort((a, b) => b.end - a.end);
                    const futureShifts = shifts.filter(s => now < s.start).sort((a, b) => a.start - b.start);

                    const lastShift = pastShifts[0];
                    const nextShift = futureShifts[0];

                    contentDiv.innerHTML = `
                        <div style="margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:10px;">
                            <div class="info-line" style="font-size:0.9rem; opacity:0.7;">SON MESAİ</div>
                            <div class="info-line"><span>${lastShift ? lastShift.endStr : '-'}</span> tarihinde çıktı.</div>
                        </div>
                        <div>
                            <div class="info-line" style="font-size:0.9rem; opacity:0.7;">GELECEK MESAİ</div>
                            <div class="info-line"><span>${nextShift ? nextShift.startStr : '-'}</span> tarihinde girecek.</div>
                        </div>
                    `;
                }
            } catch (e) {
                statusDiv.innerText = "HATA";
                console.error(e);
            }
        }

        updateLiveStatus();
        setInterval(updateLiveStatus, 60000); // Her dakikada bir kontrol et
    </script>
</body>
</html>
