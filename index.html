<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Akçay | Working Status</title>
    <style>
        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; color: white;
            text-align: center; transition: background-color 0.8s ease;
            background-color: #333;
        }
        .status-title { font-size: 1.4rem; margin-bottom: 0; opacity: 0.8; line-height: 1.2; }
        
        .status-value { 
            font-size: 4.5rem; 
            font-weight: 900; 
            margin: 15px 0; 
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        
        .countdown-container {
            font-size: 1.3rem; font-weight: 600; margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.15); padding: 12px 25px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .info-card {
            background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 24px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            min-width: 320px; border: 1px solid rgba(255,255,255,0.1);
        }
        .info-line { font-size: 1rem; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .label-group { text-align: left; display: flex; flex-direction: column; }
        .label-tr { font-weight: bold; opacity: 0.9; font-size: 0.8rem; text-transform: uppercase; }
        .label-en { font-weight: normal; opacity: 0.6; font-size: 0.65rem; }
        
        .time-val { font-family: 'Courier New', monospace; font-weight: bold; font-size: 1.1rem; }
        
        .timezone-badge {
            margin-top: 15px; font-size: 0.65rem; opacity: 0.5; font-style: italic;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;
            display: flex; flex-direction: column; gap: 2px;
        }
    </style>
</head>
<body>

    <p class="status-title">Barış şu an çalışıyor mu?<br><span style="font-size: 1rem; opacity: 0.6;">Is Barış working now?</span></p>
    <div id="status" class="status-value">...</div>

    <div id="countdown" class="countdown-container" style="display: none;"></div>

    <div id="card" class="info-card">
        <div id="content">Yükleniyor... / Loading...</div>
        <div class="timezone-badge">
            <span>Veriler Türkiye saat dilimine (UTC+3) göredir.</span>
            <span>Data is based on Turkey time zone (UTC+3).</span>
        </div>
    </div>

    <script>
        let allShifts = [];

        function parseDateTime(dateStr, timeStr) {
            if(!dateStr || !timeStr) return null;
            const [d, m, y] = dateStr.trim().split('.');
            const [hr, min] = timeStr.trim().split(':');
            return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T${hr.padStart(2,'0')}:${min.padStart(2,'0')}:00+03:00`);
        }

        function formatDuration(ms) {
            if (ms < 0) return "00:00:00";
            const hours = Math.floor(ms / (1000 * 60 * 60));
            const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((ms % (1000 * 60)) / 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        async function loadData() {
            try {
                const response = await fetch('schedule.csv?v=' + new Date().getTime());
                const text = await response.text();
                const rows = text.split('\n').slice(1).filter(r => r.trim() !== "");
                
                allShifts = rows.map(row => {
                    const cols = row.split(';');
                    return {
                        start: parseDateTime(cols[0], cols[1]),
                        end: parseDateTime(cols[2], cols[3]),
                        startStr: `${cols[0]} ${cols[1]}`,
                        endStr: `${cols[2]} ${cols[3]}`
                    };
                }).filter(s => s.start !== null);
                
                updateDisplay();
            } catch (e) {
                document.getElementById('status').innerText = "HATA / ERROR";
            }
        }

        function updateDisplay() {
            const nowInTR = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Istanbul"}));
            const statusDiv = document.getElementById('status');
            const contentDiv = document.getElementById('content');
            const countdownDiv = document.getElementById('countdown');

            if (allShifts.length === 0) return;

            const currentShift = allShifts.find(s => nowInTR >= s.start && nowInTR <= s.end);

            if (currentShift) {
                statusDiv.innerText = "EVET / YES";
                document.body.style.backgroundColor = "#28a745";
                const timeLeft = currentShift.end - nowInTR;
                countdownDiv.style.display = "block";
                countdownDiv.innerText = "Mesai Sonu / Shift End: " + formatDuration(timeLeft);
                
                contentDiv.innerHTML = `
                    <div class="info-line">
                        <div class="label-group"><span class="label-tr">Giriş</span><span class="label-en">Shift Start</span></div>
                        <span class="time-val">${currentShift.startStr}</span>
                    </div>
                    <div class="info-line">
                        <div class="label-group"><span class="label-tr">Çıkış</span><span class="label-en">Shift End</span></div>
                        <span class="time-val">${currentShift.endStr}</span>
                    </div>
                `;
            } else {
                statusDiv.innerText = "HAYIR / NO";
                document.body.style.backgroundColor = "#dc3545";

                const pastShifts = allShifts.filter(s => nowInTR > s.end).sort((a, b) => b.end - a.end);
                const futureShifts = allShifts.filter(s => nowInTR < s.start).sort((a, b) => a.start - b.start);

                const lastShift = pastShifts[0];
                const nextShift = futureShifts[0];

                if (nextShift) {
                    const timeToStart = nextShift.start - nowInTR;
                    countdownDiv.style.display = "block";
                    // Yeni ve daha net ifade:
                    countdownDiv.innerText = "Gelecek Mesai / Next Shift in: " + formatDuration(timeToStart);
                } else {
                    countdownDiv.style.display = "none";
                }

                contentDiv.innerHTML = `
                    <div style="margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
                        <div class="label-group"><span class="label-tr">Son Mesai Bitişi</span><span class="label-en">Last Shift Ended</span></div>
                        <div class="time-val" style="text-align:right;">${lastShift ? lastShift.endStr : '-'}</div>
                    </div>
                    <div>
                        <div class="label-group"><span class="label-tr">Gelecek Mesai</span><span class="label-en">Next Shift Starts</span></div>
                        <div class="time-val" style="text-align:right;">${nextShift ? nextShift.startStr : '-'}</div>
                    </div>
                `;
            }
        }

        loadData();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
