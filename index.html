<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Akçay | Status</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --accent-color: #34c759; /* Başlangıç yeşil (Müsait) */
            --glass: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; 
            font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
            color: var(--text-main); text-align: center;
            background-color: var(--bg-color);
            transition: all 0.8s ease;
            overflow: hidden;
        }

        .lang-container {
            position: absolute; top: 30px;
            background: var(--glass); padding: 4px; border-radius: 12px;
            display: flex; gap: 4px; border: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }
        .lang-btn {
            padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer;
            background: transparent; color: var(--text-dim); font-size: 0.8rem; font-weight: 600;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: rgba(255,255,255,0.1); color: white;
        }

        .bg-glow {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; height: 400px; border-radius: 50%;
            background: var(--accent-color);
            filter: blur(100px); opacity: 0.12; z-index: -1;
            transition: all 1s ease;
        }

        .status-header { margin-bottom: 50px; }
        .status-val { font-size: 3.8rem; font-weight: 800; letter-spacing: -2px; margin: 0; }
        .countdown { font-size: 1.1rem; font-weight: 300; margin-top: 10px; color: var(--text-dim); }

        .info-card {
            background: var(--glass); width: 85vw; max-width: 380px;
            border-radius: 28px; padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        .info-row {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 0;
        }
        .info-row:first-child { border-bottom: 1px solid rgba(255,255,255,0.05); }

        .label { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; text-align: left; }
        .value { text-align: right; }
        .v-date { font-size: 1rem; font-weight: 600; display: block; font-family: monospace; }
        .v-time { font-size: 0.85rem; color: var(--text-dim); }

        .footer { position: absolute; bottom: 30px; font-size: 0.7rem; color: var(--text-dim); opacity: 0.5; }
    </style>
</head>
<body>

    <div class="lang-container">
        <button class="lang-btn active" onclick="setLang('tr')">TR</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>

    <div class="bg-glow" id="glow"></div>

    <div class="status-header">
        <h1 id="status-val" class="status-val">...</h1>
        <div id="countdown" class="countdown"></div>
    </div>

    <div class="info-card" id="content-card"></div>

    <div class="footer" id="footer-text">Veriler Türkiye saat dilimine göredir (UTC+3)</div>

    <script>
        let currentLang = 'tr';
        let allShifts = [];

        const translations = {
            tr: {
                on: "MESAİDE", off: "MÜSAİT", 
                nextIn: "Gelecek mesaiye: ", endIn: "Mesai bitimine: ",
                last: "Son Mesai Bitişi", next: "Gelecek Mesai Başlangıcı",
                start: "Mesai Başlangıcı", end: "Mesai Bitişi",
                footer: "Veriler Türkiye saat dilimine göredir (UTC+3)"
            },
            en: {
                on: "ON SHIFT", off: "AVAILABLE",
                nextIn: "Next shift in: ", endIn: "Shift ends in: ",
                last: "Last Shift Ended", next: "Next Shift Starts",
                start: "Shift Start", end: "Shift End",
                footer: "Data is based on Turkey time zone (UTC+3)"
            }
        };

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
            });
            updateDisplay();
        }

        function parseDateTime(dateStr, timeStr) {
            if(!dateStr || !timeStr) return null;
            const [d, m, y] = dateStr.trim().split('.');
            const [hr, min] = timeStr.trim().split(':');
            return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T${hr.padStart(2,'0')}:${min.padStart(2,'0')}:00+03:00`);
        }

        function formatDuration(ms) {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${h}s ${m}d ${s}sn`;
        }

        async function loadData() {
            const response = await fetch('schedule.csv?v=' + new Date().getTime());
            const text = await response.text();
            const rows = text.split('\n').slice(1).filter(r => r.trim() !== "");
            allShifts = rows.map(row => {
                const cols = row.split(';');
                return {
                    start: parseDateTime(cols[0], cols[1]),
                    end: parseDateTime(cols[2], cols[3]),
                    sD: cols[0], sT: cols[1], eD: cols[2], eT: cols[3]
                };
            }).filter(s => s.start !== null);
            updateDisplay();
        }

        function updateDisplay() {
            const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Istanbul"}));
            const t = translations[currentLang];
            const current = allShifts.find(s => now >= s.start && now <= s.end);
            
            document.getElementById('footer-text').innerText = t.footer;

            if (current) {
                // MESAİDEYKEN: KIRMIZI/TURUNCU (Meşgul)
                document.getElementById('status-val').innerText = t.on;
                document.documentElement.style.setProperty('--accent-color', '#ff3b30');
                document.getElementById('countdown').innerText = t.endIn + formatDuration(current.end - now);
                renderCard(t.start, current.sD, current.sT, t.end, current.eD, current.eT);
            } else {
                // MÜSAİTKEN: YEŞİL (Ulaşılabilir)
                document.getElementById('status-val').innerText = t.off;
                document.documentElement.style.setProperty('--accent-color', '#34c759');
                const next = allShifts.filter(s => now < s.start).sort((a,b) => a.start - b.start)[0];
                const last = allShifts.filter(s => now > s.end).sort((a,b) => b.end - a.end)[0];
                document.getElementById('countdown').innerText = next ? t.nextIn + formatDuration(next.start - now) : "";
                renderCard(t.last, last?.eD, last?.eT, t.next, next?.sD, next?.sT);
            }
        }

        function renderCard(l1, d1, t1, l2, d2, t2) {
            document.getElementById('content-card').innerHTML = `
                <div class="info-row">
                    <div class="label">${l1}</div>
                    <div class="value"><span class="v-date">${d1 || '-'}</span><span class="v-time">${t1 || '-'}</span></div>
                </div>
                <div class="info-row">
                    <div class="label">${l2}</div>
                    <div class="value"><span class="v-date">${d2 || '-'}</span><span class="v-time">${t2 || '-'}</span></div>
                </div>`;
        }

        loadData();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
