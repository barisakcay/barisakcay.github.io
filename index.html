<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Akçay | Status</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #32d74b; 
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #999999;
        }

        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; 
            font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
            color: var(--text-main); text-align: center;
            background-color: var(--bg-color);
            transition: background-color 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .lang-container {
            position: absolute; top: 30px;
            background: rgba(255, 255, 255, 0.08); padding: 4px; border-radius: 12px;
            display: flex; gap: 4px; border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .lang-btn {
            padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
            background: transparent; color: var(--text-dim); font-size: 0.8rem; font-weight: 600;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: white; color: black;
        }

        .bg-glow {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 650px; height: 650px; border-radius: 50%;
            background: var(--accent-color);
            filter: blur(140px); 
            opacity: 0.28;
            z-index: -1;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-header { margin-bottom: 45px; z-index: 2; }
        .status-val { font-size: 3.8rem; font-weight: 800; letter-spacing: -2px; margin: 0; }
        .countdown { font-size: 1.15rem; font-weight: 400; margin-top: 10px; color: white; opacity: 0.9; }

        .info-card {
            background: var(--glass); width: 88vw; max-width: 380px;
            border-radius: 30px; padding: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 2;
        }

        .info-row {
            display: flex; justify-content: space-between; align-items: center; padding: 18px 0;
        }
        .info-row:first-child { border-bottom: 1px solid rgba(255,255,255,0.08); }

        .label { font-size: 0.85rem; color: var(--text-dim); font-weight: 500; text-align: left; }
        .value { text-align: right; }
        .v-date { font-size: 1.05rem; font-weight: 600; display: block; font-family: monospace; }
        .v-time { font-size: 0.85rem; color: var(--text-dim); }

        .footer { position: absolute; bottom: 30px; font-size: 0.75rem; color: var(--text-dim); opacity: 0.6; }
    </style>
</head>
<body>

    <div class="lang-container">
        <button class="lang-btn active" id="btn-tr" onclick="setLang('tr')">TR</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <div class="bg-glow" id="glow"></div>

    <div class="status-header">
        <h1 id="status-val" class="status-val">...</h1>
        <div id="countdown" class="countdown"></div>
    </div>

    <div class="info-card" id="content-card"></div>

    <div class="footer" id="footer-text">Veriler Türkiye saat dilimine göredir (UTC+3)</div>

    <script>
        let currentLang = 'tr';
        let allShifts = [];

        const translations = {
            tr: {
                on: "MESAİDE", off: "MÜSAİT", 
                nextIn: "Gelecek mesaiye: ", endIn: "Mesai bitimine: ",
                last: "Son Mesai Bitişi", next: "Gelecek Mesai Başlangıcı",
                start: "Mesai Başlangıcı", end: "Mesai Bitişi",
                footer: "Veriler Türkiye saat dilimine göredir (UTC+3)",
                h: "s", m: "d", s: "sn"
            },
            en: {
                on: "ON SHIFT", off: "AVAILABLE",
                nextIn: "Next shift in: ", endIn: "Shift ends in: ",
                last: "Last Shift Ended", next: "Next Shift Starts",
                start: "Shift Start", end: "Shift End",
                footer: "Data is based on Turkey time zone (UTC+3)",
                h: "h", m: "min", s: "sec"
            }
        };

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            updateDisplay();
        }

        function parseDateTime(dateStr, timeStr) {
            if(!dateStr || !timeStr) return null;
            const [d, m, y] = dateStr.trim().split('.');
            const [hr, min] = timeStr.trim().split(':');
            return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T${hr.padStart(2,'0')}:${min.padStart(2,'0')}:00+03:00`);
        }

        function formatDuration(ms) {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const t = translations[currentLang];
            return `${h}${t.h} ${m}${t.m} ${s}${t.s}`;
        }

        async function loadData() {
            try {
                const response = await fetch('schedule.csv?v=' + new Date().getTime());
                const text = await response.text();
                const rows = text.split('\n').slice(1).filter(r => r.trim() !== "");
                allShifts = rows.map(row => {
                    const cols = row.split(';');
                    return {
                        start: parseDateTime(cols[0], cols[1]),
                        end: parseDateTime(cols[2], cols[3]),
                        sD: cols[0], sT: cols[1], eD: cols[2], eT: cols[3]
                    };
                }).filter(s => s.start !== null);
                updateDisplay();
            } catch (e) { document.getElementById('status-val').innerText = "ERROR"; }
        }

        function updateDisplay() {
            const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Istanbul"}));
            const t = translations[currentLang];
            const current = allShifts.find(s => now >= s.start && now <= s.end);
            
            document.getElementById('footer-text').innerText = t.footer;

            if (current) {
                document.getElementById('status-val').innerText = t.on;
                document.documentElement.style.setProperty('--accent-color', '#ff453a');
                document.body.style.backgroundColor = "#140a0a"; 
                document.getElementById('countdown').innerText = t.endIn + formatDuration(current.end - now);
                renderCard(t.start, current.sD, current.sT, t.end, current.eD, current.eT);
            } else {
                document.getElementById('status-val').innerText = t.off;
                document.documentElement.style.setProperty('--accent-color', '#32d74b');
                document.body.style.backgroundColor = "#0a140b"; 
                const next = allShifts.filter(s => now < s.start).sort((a,b) => a.start - b.start)[0];
                const last = allShifts.filter(s => now > s.end).sort((a,b) => b.end - a.end)[0];
                document.getElementById('countdown').innerText = next ? t.nextIn + formatDuration(next.start - now) : "";
                renderCard(t.last, last?.eD, last?.eT, t.next, next?.sD, next?.sT);
            }
        }

        function renderCard(l1, d1, t1, l2, d2, t2) {
            document.getElementById('content-card').innerHTML = `
                <div class="info-row">
                    <div class="label">${l1}</div>
                    <div class="value"><span class="v-date">${d1 || '-'}</span><span class="v-time">${t1 || '-'}</span></div>
                </div>
                <div class="info-row">
                    <div class="label">${l2}</div>
                    <div class="value"><span class="v-date">${d2 || '-'}</span><span class="v-time">${t2 || '-'}</span></div>
                </div>`;
        }

        loadData();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
