<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Akçay | Status</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --accent-color: #dc3545; /* Varsayılan Kırmızı */
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white; text-align: center;
            background-color: var(--bg-color);
            transition: background-color 1s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Arka plan gradyan efekti */
        .bg-glow {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 500px; border-radius: 50%;
            background: var(--accent-color);
            filter: blur(120px); opacity: 0.15; z-index: -1;
            transition: background 1s ease;
        }

        .container {
            width: 90%; max-width: 450px; z-index: 1;
        }

        .header-box { margin-bottom: 40px; }
        
        .status-title { 
            font-size: 0.9rem; font-weight: 500; letter-spacing: 2px;
            text-transform: uppercase; opacity: 0.6; margin-bottom: 10px;
        }

        .status-value { 
            font-size: 3.5rem; font-weight: 800; margin: 0;
            letter-spacing: -1px; line-height: 1;
        }

        .countdown-box {
            margin-top: 15px; font-size: 1.2rem; font-weight: 300;
            font-variant-numeric: tabular-nums; opacity: 0.9;
        }

        .info-card {
            background: var(--glass);
            padding: 30px; border-radius: 32px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin-top: 40px;
        }

        .shift-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0;
        }
        .shift-row:first-child { border-bottom: 1px solid rgba(255,255,255,0.05); }

        .label-wrap { text-align: left; }
        .label-main { font-size: 0.85rem; font-weight: 600; display: block; }
        .label-sub { font-size: 0.65rem; opacity: 0.5; text-transform: uppercase; }

        .time-wrap { text-align: right; }
        .date-val { font-size: 0.95rem; font-weight: 600; display: block; font-family: 'Courier New', monospace; }
        .time-val { font-size: 0.8rem; opacity: 0.6; }

        .footer-note {
            margin-top: 30px; font-size: 0.65rem; opacity: 0.4;
            line-height: 1.5; font-weight: 400;
        }

        /* Mobil Optimizasyon */
        @media (max-width: 400px) {
            .status-value { font-size: 2.8rem; }
            .info-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow" id="glow"></div>

    <div class="container">
        <div class="header-box">
            <div class="status-title">Barış Akçay</div>
            <h1 id="status" class="status-value">...</h1>
            <div id="countdown" class="countdown-box"></div>
        </div>

        <div class="info-card">
            <div id="content">
                </div>
        </div>

        <div class="footer-note">
            Veriler Türkiye saat dilimine (UTC+3) göredir.<br>
            Data is based on Turkey time zone (UTC+3).
        </div>
    </div>

    <script>
        let allShifts = [];

        function parseDateTime(dateStr, timeStr) {
            if(!dateStr || !timeStr) return null;
            const [d, m, y] = dateStr.trim().split('.');
            const [hr, min] = timeStr.trim().split(':');
            return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T${hr.padStart(2,'0')}:${min.padStart(2,'0')}:00+03:00`);
        }

        function formatDuration(ms) {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${h}h ${m}m ${s}s`;
        }

        async function loadData() {
            try {
                const response = await fetch('schedule.csv?v=' + new Date().getTime());
                const text = await response.text();
                const rows = text.split('\n').slice(1).filter(r => r.trim() !== "");
                allShifts = rows.map(row => {
                    const cols = row.split(';');
                    return {
                        start: parseDateTime(cols[0], cols[1]),
                        end: parseDateTime(cols[2], cols[3]),
                        sDate: cols[0], sTime: cols[1], eDate: cols[2], eTime: cols[3]
                    };
                }).filter(s => s.start !== null);
                updateDisplay();
            } catch (e) { document.getElementById('status').innerText = "ERROR"; }
        }

        function updateDisplay() {
            const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Istanbul"}));
            const statusDiv = document.getElementById('status');
            const countdownDiv = document.getElementById('countdown');
            const contentDiv = document.getElementById('content');
            const glow = document.getElementById('glow');

            const current = allShifts.find(s => now >= s.start && now <= s.end);

            if (current) {
                statusDiv.innerText = "MESAI / ON SHIFT";
                document.body.style.backgroundColor = "#0d1f12"; // Koyu Yeşil Teması
                document.documentElement.style.setProperty('--accent-color', '#28a745');
                const timeLeft = current.end - now;
                countdownDiv.innerText = "Ending in: " + formatDuration(timeLeft);
                contentDiv.innerHTML = renderRow("Giriş / Start", current.sDate, current.sTime) + renderRow("Çıkış / End", current.eDate, current.eTime);
            } else {
                statusDiv.innerText = "OFF / MÜSAİT";
                document.body.style.backgroundColor = "#1a1a1a"; // Koyu Gri Teması
                document.documentElement.style.setProperty('--accent-color', '#dc3545');
                const next = allShifts.filter(s => now < s.start).sort((a,b) => a.start - b.start)[0];
                const last = allShifts.filter(s => now > s.end).sort((a,b) => b.end - a.end)[0];
                
                countdownDiv.innerText = next ? "Next shift in: " + formatDuration(next.start - now) : "";
                contentDiv.innerHTML = renderRow("Son Mesai / Last", last?.eDate, last?.eTime) + renderRow("Gelecek / Next", next?.sDate, next?.sTime);
            }
        }

        function renderRow(label, date, time) {
            if(!date) return "";
            const labels = label.split(' / ');
            return `
                <div class="shift-row">
                    <div class="label-wrap">
                        <span class="label-main">${labels[0]}</span>
                        <span class="label-sub">${labels[1]}</span>
                    </div>
                    <div class="time-wrap">
                        <span class="date-val">${date}</span>
                        <span class="time-val">${time}</span>
                    </div>
                </div>`;
        }

        loadData();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
